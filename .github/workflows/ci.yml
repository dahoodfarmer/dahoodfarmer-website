name: Website CI

on:
  push:
    branches:
      - feature/dhf-provider-neutral-payment-center
  pull_request:
    branches:
      - site-rebuild-v2
      - feature/loopy-carter-dual-identity
      - feature/dhf-opportunity-network-build
      - feature/dhf-sponsor-invoice-checkout

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Run tests
        run: npm test
