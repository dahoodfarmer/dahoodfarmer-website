# Wrangler configuration for Cloudflare Pages
# Production deployment is connected to the site-rebuild-v2 GitHub branch.

name = "dahoodfarmer-website"
compatibility_date = "2026-11-03"
pages_build_output_dir = "public"

[[d1_databases]]
binding = "DB"
database_name = "dahoodfarmer-db"
database_id = "60c66fbd-bde7-4dde-a822-aee20c42eb6b"

[[kv_namespaces]]
binding = "SESSIONS"
id = "ac795693406f4c1998ceb35868b6155c"

[vars]
GA4_ID = "G-BQJHY0DYR2"
GTM_ID = ""
ADSENSE_ID = "ca-pub-5452000990146137"
TURNSTILE_SITE_KEY = "0x4AAAAAAF4NKcwMel-ag1kV"
NOTIFICATION_EMAIL = "hoodfarmer202@gmail.com"

# Cloudflare Access JWT verification for the admin API.
# These are public identifiers, not secrets. The Access app policy controls the allowed identity.
ACCESS_ISSUER = "https://snowy-silence-28c3.cloudflareaccess.com"
ACCESS_AUD = "6a0c1ed1900526a1e3550094c3c71bd43ea2c0a6cdf9557f340c764cf3675909"

# Keep TURNSTILE_SECRET_KEY and provider API keys configured as Cloudflare Pages secrets.
# Never put private API keys or secrets in this file.

