<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Page Not Found | Da HoodFarmer</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="The page you are looking for could not be found.">
  <link rel="stylesheet" href="/styles.css">
  <style>
    .error-wrap {
      min-height: 70vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }
    .error-code {
      font-size: clamp(4rem, 15vw, 9rem);
      font-weight: 800;
      line-height: 1;
      margin: 0;
      letter-spacing: -0.03em;
    }
    .error-msg {
      font-size: clamp(1.1rem, 3vw, 1.5rem);
      margin: 1rem 0 2rem;
      opacity: 0.85;
    }
    .error-btn {
      display: inline-block;
      padding: 0.8rem 2rem;
      border-radius: 8px;
      font-weight: 600;
      text-decoration: none;
      transition: opacity 0.2s ease;
    }
    .error-btn:hover { opacity: 0.85; }
  </style>
</head>
<body>
  <header>
    <nav>
      <a href="/">Da HoodFarmer</a>
    </nav>
  </header>

  <main class="error-wrap">
    <p class="error-code">404</p>
    <p class="error-msg">This page took a wrong turn and got lost in the field.</p>
    <a class="error-btn" href="/">Back to Home</a>
  </main>

  <footer>
    <p>&copy; <span id="year"></span> Da HoodFarmer. All rights reserved.</p>
  </footer>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>
</body>
</html>
