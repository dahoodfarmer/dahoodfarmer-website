<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Sponsor Invoice — Da HoodFarmer</title>
<link rel="stylesheet" href="/styles.css">
<style>
.invoice-wrap{max-width:760px;margin:3rem auto;padding:1rem}
.invoice-card{background:#111c2b;border:1px solid #33465f;border-radius:14px;padding:clamp(1.2rem,4vw,2rem)}
.invoice-card h1{color:#e9c85b}
.invoice-amount{font-size:2rem;font-weight:800;color:#fff;margin:1rem 0}
.invoice-meta{color:#aebbd0}
.invoice-status{padding:.9rem;border-radius:8px;background:#1c2c40;margin:1rem 0}
button{background:#d6b64c;color:#111827;border:0;border-radius:8px;padding:.9rem 1.2rem;font-weight:800;cursor:pointer}
button:disabled{opacity:.5;cursor:not-allowed}
#checkout{margin-top:1rem}
</style>
</head>
<body>
<main class="invoice-wrap">
 <section class="invoice-card">
  <p class="invoice-meta">Da HoodFarmer · Secure sponsor invoice</p>
  <h1 id="title">Loading invoice…</h1>
  <p id="organization" class="invoice-meta"></p>
  <div id="amount" class="invoice-amount"></div>
  <p id="due" class="invoice-meta"></p>
  <div id="status" class="invoice-status" role="status" aria-live="polite">Checking invoice details…</div>
  <button id="pay" type="button" disabled>Continue to secure payment</button>
  <div id="checkout"></div>
  <p class="invoice-meta" style="font-size:.8rem;margin-top:1.5rem">Payment details are handled by the payment provider. Da HoodFarmer does not store card numbers or security codes.</p>
 </section>
</main>
<script src="https://js.stripe.com/v3/"></script>
<script>
(function(){
 'use strict';
 var params=new URLSearchParams(location.search),token=params.get('token')||'';
 var title=document.getElementById('title'),org=document.getElementById('organization'),amount=document.getElementById('amount'),due=document.getElementById('due'),status=document.getElementById('status'),button=document.getElementById('pay');
 var invoice=null,busy=false;
 function money(cents,currency){try{return new Intl.NumberFormat(undefined,{style:'currency',currency:(currency||'usd').toUpperCase()}).format(Number(cents)/100)}catch(e){return '$'+(Number(cents)/100).toFixed(2)}}
 function showError(message){status.textContent=message;button.disabled=true}
 if(!/^[a-f0-9]{64}$/i.test(token)){showError('This invoice link is invalid. Please contact Da HoodFarmer.');return}
 fetch('/api/payments/invoice?token='+encodeURIComponent(token),{cache:'no-store'}).then(function(r){return r.json().then(function(d){if(!r.ok)throw new Error(d.error||'Invoice could not be loaded.');return d})}).then(function(data){
  invoice=data.invoice;
  title.textContent=invoice.description||'Sponsor invoice';
  org.textContent=invoice.organization?'Prepared for '+invoice.organization:'';
  amount.textContent=money(invoice.amount_cents,invoice.currency);
  due.textContent=invoice.due_date?'Payment due: '+invoice.due_date:'';
  if(invoice.status==='paid'){status.textContent='This invoice has already been paid. Thank you.';button.hidden=true;return}
  if(!data.checkout_available){status.textContent='This invoice is valid, but online payment is not yet enabled. Please contact your Da HoodFarmer representative for payment instructions.';button.disabled=true;return}
  status.textContent='Invoice verified. Continue to the secure payment form when ready.';
  button.disabled=false;
 }).catch(function(e){showError(e.message)});
 button.addEventListener('click',function(){
  if(busy||!invoice)return;busy=true;button.disabled=true;button.textContent='Preparing secure checkout…';
  fetch('/api/payments/create-session',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({purpose:'invoice',invoice_token:token})}).then(function(r){return r.json().then(function(d){if(!r.ok)throw new Error(d.error||'Checkout could not be started.');return d})}).then(function(data){
   if(data.status==='paid'){status.textContent='This invoice has already been paid.';return}
   if(!window.Stripe)throw new Error('Secure payment service did not load. Refresh and try again.');
   var stripe=window.Stripe(data.publishableKey);
   return stripe.initEmbeddedCheckout({clientSecret:data.clientSecret}).then(function(checkout){button.hidden=true;checkout.mount('#checkout');status.textContent='Complete your payment using the secure checkout below.'});
  }).catch(function(e){status.textContent=e.message;button.disabled=false;button.textContent='Try secure payment again'}).finally(function(){busy=false});
 });
})();
</script>
<script src="/script.js"></script>
</body>
</html>
