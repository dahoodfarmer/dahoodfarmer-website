<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Payment Status — Da HoodFarmer</title>
<link rel="stylesheet" href="/styles.css">
<style>.status-wrap{max-width:680px;margin:4rem auto;padding:1rem}.status-card{background:#111c2b;border:1px solid #33465f;border-radius:14px;padding:2rem;text-align:center}.status-card h1{color:#e9c85b}.muted{color:#aebbd0}</style>
</head>
<body>
<main class="status-wrap"><section class="status-card"><h1>Payment status</h1><p id="message" class="muted">Verifying payment with the payment provider…</p><p id="reference" class="muted"></p><a href="/" class="btn btn-gold">Return to Da HoodFarmer</a></section></main>
<script>
(function(){
 var session=new URLSearchParams(location.search).get('session_id')||'',message=document.getElementById('message'),reference=document.getElementById('reference');
 if(!/^cs_(test_|live_)[A-Za-z0-9]+$/.test(session)){message.textContent='The payment reference is invalid. If you completed a payment, contact Da HoodFarmer.';return}
 fetch('/api/payments/status?session_id='+encodeURIComponent(session),{cache:'no-store'}).then(function(r){return r.json().then(function(d){if(!r.ok)throw new Error(d.error||'Payment status is unavailable.');return d})}).then(function(d){
  reference.textContent='Order reference: '+d.orderId;
  if(d.status==='paid')message.textContent='Payment confirmed. Your sponsor invoice has been marked paid. Thank you.';
  else if(d.status==='processing'||d.status==='pending')message.textContent='Your payment is being processed. This page can be refreshed in a moment; confirmation is based on the verified payment record.';
  else if(d.status==='failed')message.textContent='The payment was not completed. Return to your invoice link or contact Da HoodFarmer.';
  else if(d.status==='expired')message.textContent='This payment session expired. Please return to your invoice link to try again.';
  else message.textContent='Payment status: '+d.status+'. Contact Da HoodFarmer if you need assistance.';
 }).catch(function(e){message.textContent=e.message});
})();
</script>
<script src="/script.js"></script>
</body>
</html>
