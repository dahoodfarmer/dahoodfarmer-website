<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Payment Status — Da HoodFarmer</title><link rel="stylesheet" href="/styles.css"><style>.result{max-width:620px;margin:5rem auto;padding:2rem;text-align:center;background:#151515;border:1px solid #8d74c4;border-radius:16px}.result h1{font-family:Georgia,serif;color:#d8bd76}.muted{color:#aaa}</style></head>
<body><main class="result"><h1>Da HoodFarmer Payment</h1><h2 id="heading">Checking payment status…</h2><p id="detail" class="muted">Please keep this page open while we confirm your payment.</p><a href="/" class="btn btn-gold">Return to website</a></main>
<script>
(async()=>{const heading=document.getElementById('heading'),detail=document.getElementById('detail');const sessionId=new URLSearchParams(location.search).get('session_id');if(!sessionId){heading.textContent='Payment reference missing';detail.textContent='If you completed a payment, contact us so we can verify it.';return;}try{const r=await fetch('/api/payments/status?session_id='+encodeURIComponent(sessionId));const d=await r.json();if(!r.ok)throw new Error(d.error||'Status unavailable');if(d.status==='paid'){heading.textContent='Payment confirmed';detail.textContent='Thank you. Your payment has been successfully confirmed.';}else if(d.status==='processing'||d.status==='pending'){heading.textContent='Payment processing';detail.textContent='Your payment is not yet confirmed. Please allow a moment and refresh this page.';}else{heading.textContent='Payment not completed';detail.textContent='The payment status is '+d.status+'. No successful payment is recorded.';}}catch(e){heading.textContent='Unable to confirm payment';detail.textContent='Please contact us before attempting another payment.';}})();
</script></body></html>
